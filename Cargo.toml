[package]
name = "codebridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[workspace]
members = ["crates/core", "crates/codexbridge", "crates/tgbot"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
codebridge-core = { path = "crates/core" }
codexbridge = { path = "crates/codexbridge" }
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
serde_json = "1"
tgbot = { path = "crates/tgbot" }
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "macros", "rustls"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
# E0365 fix from https://github.com/GnomedDev/proc-macro-error-2/pull/14.
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

[dependencies]
codebridge-core.workspace = true
clap = { version = "4.5", features = ["derive"] }
codexbridge.workspace = true
teloxide.workspace = true
tgbot.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
